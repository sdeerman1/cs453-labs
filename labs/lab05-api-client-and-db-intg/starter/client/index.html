<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 Client</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Lab 5 Inventory Client</h1>

        <div class="actions">
          <button id="load-items" type="button">Load Items</button>
        </div>

        <form id="add-item-form">
          <label>
            Name
            <input id="item-name" name="name" type="text" required>
          </label>

          <label>
            Quantity
            <input id="item-quantity" name="quantity" type="number" min="0" required>
          </label>

          <label>
            Category (1: Tech Supplies, 2: Office Supplies)
            <input id="item-category" name="category" type="number" required>
          </label>

          <button type="submit">Add Item</button>
        </form>

        <p id="status" class="status">Ready.</p>

        <ul id="items" class="items"></ul>

      </section>

      <section class="panel">
        <h1>Edits</h1>
        <h2>Update an Item</h2>
        <form id="update-item-form">
          <label>
            ID of item
            <input id="update-id" name="update-id" type="number" min="1" required>
          </label>
          <label>
            Name
            <input id="update-item-name" name="name" type="text" required>
          </label>
          <label>
            Quantity
            <input id="update-item-quantity" name="quantity" type="number" min="0" required>
          </label>
          <label>
            Category (1: Tech Supplies, 2: Office Supplies)
            <input id="update-item-category" name="category" type="number" required>
          </label>

          <button type="submit">Update Item</button>
        </form>

        <h2>Delete an Item</h2>

        <form id="delete-item-form">
          <label>
            ID of item
            <input id="delete-id" name="delete-id" type="number" min="1" required>
          </label>
          <button id="delete-item" type="submit">Delete</button>
        </form>
      </section>

    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
